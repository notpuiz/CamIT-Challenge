<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" id="theme-color-meta" content="#fafafa">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      try {
        const saved = localStorage.getItem('camit-theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const isDark = saved ? saved === 'dark' : prefersDark
        document.documentElement.classList.toggle('dark', isDark)
        const meta = document.getElementById('theme-color-meta')
        if (meta) meta.setAttribute('content', isDark ? '#09090b' : '#fafafa')
        const savedLocale = localStorage.getItem('camit-locale')
        document.documentElement.lang = savedLocale === 'km' ? 'km' : 'en'
      } catch {}
    </script>
    <title>CamIT — Jobs Across Cambodia</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
